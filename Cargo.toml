[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/auth",
    "crates/net",
    "crates/scripting",
    "crates/runner",
    "crates/import_export",
    "crates/proxy",
    "crates/ui",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates
apitester-core = { path = "crates/core" }

# Shared external crates
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
